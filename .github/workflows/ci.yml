name: CI/CD Workflow

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check project files
        run: |
          test -f README.md
          test -f main.py
          test -f index.html
          echo "All required files exist"

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Check HTML structure
        run: |
          python -c "from html.parser import HTMLParser; from pathlib import Path; p=HTMLParser(); p.feed(Path('index.html').read_text(encoding='utf-8')); print('HTML check passed')"

      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp README.md _site/README.md

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4